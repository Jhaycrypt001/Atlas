# Render Blueprint for Atlas (#6991)
#
# atlas-a2a-daemon — the ALWAYS-ON okx-a2a XMTP daemon that OKX pings for the
# online check. This is the service that keeps agent #6991 listed.
#
# Key design decisions (learned the hard way):
#  - The daemon's AI provider is the Claude Code CLI. It authenticates HEADLESSLY
#    when ANTHROPIC_API_KEY is present in the environment (no interactive login).
#    So the build installs BOTH @okxweb3/a2a-node and @anthropic-ai/claude-code.
#  - Render's filesystem is EPHEMERAL. The daemon's XMTP + sqlite identity lives
#    in ~/.okx-agent-task. We mount a PERSISTENT DISK and point HOME at it so a
#    redeploy/restart does NOT mint a new agent identity (which would fail OKX's
#    online check for #6991).

services:
  - type: worker
    name: atlas-a2a-daemon
    runtime: node
    # standard (2 GB), NOT starter (512 MB). On boot the daemon fires
    # `wakeup-notify`, and OKX pushes back one `wakeup_notify` event per job with a
    # session — 3 of them today. Each spawns a `claude --print` subsession worth
    # hundreds of MB, all within ~1 second. On starter that OOM-killed the container
    # 8-18s into every boot, twice reproduced (deploys 51cf85f and ce0fda1). The
    # agent only appeared stable because the SECOND boot's wakeup-notify errored
    # (code=1), so nothing spawned and nothing died — luck, not design.
    #
    # a2a-node@0.1.10 exposes NO knob to cap AI-session concurrency (checked the full
    # OKX_A2A_* / OKX_AGENT_TASK_* env surface), so headroom is the only lever. Now
    # that #6991 is "Listed — eligible for task recommendations", several designations
    # landing at once is the expected steady state, not an edge case.
    plan: standard           # background workers require a paid plan (no free worker tier)
    region: oregon           # keep consistent; pick the region closest to you
    autoDeploy: false        # avoid surprise restarts that flap the online status
    # Build installs ONLY the global npm packages. The persistent disk ($HOME) is
    # NOT mounted at build time, so anything touching the disk lives in startCommand.
    buildCommand: bash deploy/build.sh
    # Online status comes from the BACKGROUND daemon's XMTP listener (evidence: the
    # only boot where OKX saw us online was the one where `daemon start` reported
    # `pid=..., ready`). So we: restore identity, install onchainos (best-effort),
    # bind the provider, explicitly start the daemon, then run a foreground keepalive
    # loop that re-starts the daemon if it ever dies. `okx-a2a logs server` tails the
    # listener log in the foreground so the container stays alive AND we get logs.
    startCommand: bash deploy/run-daemon.sh
    disk:
      name: okx-agent-state
      mountPath: /var/okx-home   # HOME points here so ~/.okx-agent-task persists
      sizeGB: 1
    envVars:
      - key: HOME
        value: /var/okx-home
      # REQUIRED so the headless `claude --print` subsession can run its onchainos/Bash
      # tool calls without a human approver. Without this the preset falls back to "auto",
      # tool calls are blocked, and the agent never replies -> OKX task times out.
      # The daemon reads this env override BEFORE any on-disk sqlite flag.
      - key: OKX_A2A_AI_PERMISSION_PRESET
        value: bypass
      # NOTE: OKX_A2A_AI_CWD is deliberately NOT set here — it does not work.
      # a2a-node@0.1.10 startDaemon() hard-injects OKX_A2A_AI_CWD=<workspace> into the
      # listener's env (dist/cli.js:1974), clobbering any value set here, and wipes that
      # workspace on every start. The agent brief is installed by run-daemon.sh into
      # $HOME/.claude/CLAUDE.md (user-level, loaded regardless of cwd) instead.
      - key: ANTHROPIC_API_KEY
        sync: false            # set in the Render dashboard — NEVER commit it
      - key: OKX_ONCHAINOS_SESSION_B64
        sync: false            # onchainos wallet session; dashboard-only, holds key material
      - key: OKX_IDENTITY_PASSPHRASE
        sync: false            # decrypts deploy/okx-identity.tgz.enc on first boot; dashboard-only
